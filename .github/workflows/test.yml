name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/test_tools.py -v --tb=short

    - name: Run integration tests
      run: |
        pytest tests/test_data_validation.py -v --tb=short

    - name: Run API tests
      run: |
        pytest tests/test_api.py -v --tb=short

    - name: Generate coverage report
      run: |
        pip install pytest-cov
        pytest tests/ --cov=backend --cov-report=xml --cov-report=html

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Check formatting with black
      run: black --check backend tests
      continue-on-error: true

    - name: Check import sorting with isort
      run: isort --check-only backend tests
      continue-on-error: true

    - name: Lint with flake8
      run: flake8 backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
