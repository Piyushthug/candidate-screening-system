name: Tests & Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: cd frontend && npm install
    
    - name: Run tests
      run: cd frontend && npm test -- --run
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./frontend/coverage/coverage-final.json
        flags: frontend

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: pip install -r requirements.txt pytest pytest-cov
    
    - name: Run tests
      run: python -m pytest tests/ -v --cov=backend --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: backend

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install lint tools
      run: pip install flake8 black isort
    
    - name: Run flake8
      run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Check black formatting
      run: black --check backend
    
    - name: Check import sorting
      run: isort --check-only backend

  api-validation:
    name: API Endpoint Validation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Start API server
      run: |
        python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
        sleep 3
    
    - name: Test health endpoint
      run: curl -f http://localhost:8000/health || exit 1
    
    - name: Test API endpoints
      run: |
        curl -f http://localhost:8000/jobs || exit 1
        curl -f http://localhost:8000/candidates || exit 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install bandit
      run: pip install bandit
    
    - name: Run security scan
      run: bandit -r backend --skip B608

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Build frontend
      run: cd frontend && npm install && npm run build
    
    - name: Verify build output
      run: ls -la frontend/dist/

