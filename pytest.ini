[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    skip_ci: Skip in CI environment

# Skip API endpoint tests due to SQLite threading issues
# Use: pytest tests/test_screening_tools.py tests/test_screening_service.py
